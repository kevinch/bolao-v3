name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Recharts pulls stable d3 modules with low OpenSSF scores (no recent
          # commits) but no known CVEs. Rely on fail-on-severity for vulns.
          warn-on-openssf-scorecard-level: 0
